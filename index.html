
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>RetailPulse Analytics</title>
  <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>
  <main>
    <section id="login-section">
      <div class="login-card">
        <h1>RetailPulse</h1>
        <p>Cloud Retail Analytics Platform</p>

        <form id="login-form">
          <input id="email" type="email"
                 placeholder="Email" required>
          <input id="password" type="password"
                 placeholder="Password" required>
          <button type="submit">Sign In</button>
        </form>

        <p id="message"></p>
      </div>
    </section>

    <section id="dashboard" hidden>
      <header>
        <div>
          <h1>RetailPulse Analytics</h1>
          <p>Retail Performance Overview — 2025</p>
        </div>
        <button id="logout">Sign Out</button>
      </header>

      <div class="metrics">
        <article>
          <span>Total Revenue</span>
          <h2 id="revenue">—</h2>
        </article>
        <article>
          <span>Total Orders</span>
          <h2 id="orders">—</h2>
        </article>
        <article>
          <span>Average Order Value</span>
          <h2 id="average">—</h2>
        </article>
        <article>
          <span>Total Customers</span>
          <h2 id="customers">—</h2>
        </article>
      </div>

      <article class="chart-card">
        <h2>Monthly Sales Performance</h2>
        <div class="chart-container">
          <canvas id="sales-chart"></canvas>
        </div>
      </article>

      <p id="dashboard-status">Loading data...</p>
    </section>
  </main>

  <script type="module" src="/frontend/js/main.js"></script>
</body>
</html>
